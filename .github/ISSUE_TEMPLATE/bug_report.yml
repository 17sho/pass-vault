name: Bug report
description: Report a reproducible product or deployment problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, vault keys, invite codes, production tokens, or plaintext vault contents.
        For suspected security vulnerabilities, use the private security reporting channel instead.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.1.71 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Cloudflare Worker / D1 / R2
        - Linux Node.js / SQLite
        - Local development
        - Unknown
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest safe reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Safe logs or screenshots
      description: Redact domains, usernames, identifiers, cookies, tokens, and vault data.
