name: Feature request
description: Suggest a focused improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the user problem first. Do not include plaintext vault data or credentials.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
