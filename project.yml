name: PassVault
options:
  bundleIdPrefix: me.23cm
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  PassVault:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Storage
      - path: Features
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.23cm.passvault.local
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pass Vault
        INFOPLIST_KEY_NSPrincipalClass: "$(PRODUCT_MODULE_NAME).PassVaultApplication"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock your local encrypted Pass Vault.
        INFOPLIST_KEY_NSCameraUsageDescription: Add photos and videos as encrypted attachments.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Select photos and videos to add as encrypted attachments.
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets:
        - PassVaultTests
  PassVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PassVaultTests
    dependencies:
      - target: PassVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.23cm.passvault.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  PassVaultUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PassVaultUITests
    dependencies:
      - target: PassVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.23cm.passvault.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  PassVault:
    build:
      targets:
        PassVault: all
        PassVaultTests: [test]
    test:
      targets:
        - PassVaultTests
  PassVaultScreenshots:
    build:
      targets:
        PassVault: all
        PassVaultUITests: [test]
    test:
      targets:
        - PassVaultUITests
